[project]
name = "tacticore"
version = "0.1.0"
description = "Motor de regras de combate tatico por turnos, baseado na SRD 5.1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacticore"]

# ---------------------------------------------------------------- ruff -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PT", "TID", "C4", "PL"]

# PLR2004 (numero magico) fica LIGADO no core de proposito: numero magico no
# core e regra sem nome. Em teste, numero magico E o valor esperado.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN201"]
# PLR0913 conta argumento nomeado tambem. Um builder kw-only que espelha uma
# dataclass de oito campos tem oito kwargs por definicao, e nenhum deles e
# posicional -- a complexidade que a regra persegue nao existe aqui.
"src/tacticore/core/testing.py" = ["PLR0913"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy -----
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
strict_equality = true

# -------------------------------------------------------------- pytest -----
[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
# Warning acumulado em silencio e divida que vence no upgrade seguinte.
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "slow: teste lento (estatistico); fora do loop de desenvolvimento",
]

# ------------------------------------------------------------ coverage -----
# source_pkgs (e nao source) para o src layout mapear no pacote instalado.
# O gate cobre so o core: CLI, fixtures e scripts ficam de fora de proposito.
[tool.coverage.run]
branch = true
source_pkgs = ["tacticore.core"]

[tool.coverage.report]
fail_under = 95
show_missing = true
